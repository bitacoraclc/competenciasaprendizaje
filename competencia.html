<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0b1120">
<title>Competencia Visual</title>
<style>
:root {
  --bg: #0f172a; --panel: #1e293b; --input: #334155; --txt: #f1f5f9;
  --muted: #94a3b8; --border: #334155; --btn: #3b82f6;
  --success: #22c55e; --danger: #ef4444; --warning: #facc15;
  --path: #475569; --path-active: #60a5fa;
}
body.light-mode {
  --bg: #f8fafc; --panel: #ffffff; --input: #e2e8f0; --txt: #0f172a;
  --muted: #64748b; --border: #cbd5e1; --path: #cbd5e1; --path-active: #3b82f6;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--txt); height: 100vh; display: flex; flex-direction: column; overflow: hidden; transition: background 0.3s, color 0.3s; }

/* Pantalla de inicio */
#pantallaInicio { max-width: 500px; margin: 10vh auto; padding: 32px; background: var(--panel); border-radius: 16px; border: 1px solid var(--border); text-align: center; }
#pantallaInicio h1 { font-size: 22px; margin-bottom: 24px; }
.form-group { margin-bottom: 16px; text-align: left; }
.form-group label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
.form-group select, .form-group input { width: 100%; height: 44px; padding: 0 14px; background: var(--input); color: var(--txt); border: 1px solid var(--border); border-radius: 8px; font-size: 15px; }
.btn-primary { width: 100%; height: 48px; background: var(--btn); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 8px; }
.btn-primary:hover { opacity: 0.9; }

/* Pantalla principal */
#pantallaPrincipal { display: none; height: 100vh; flex-direction: column; }
#pantallaPrincipal.active { display: flex; }

.header-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 24px; background: var(--panel); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.header-bar h2 { font-size: 18px; font-weight: 700; }
.header-bar .info { font-size: 14px; color: var(--muted); margin-top: 2px; }
.btn-small { padding: 8px 16px; background: var(--input); color: var(--txt); border: 1px solid var(--border); border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; margin-left: 8px; }
.btn-small:hover { opacity: 0.8; }
.btn-danger { background: var(--danger); color: white; border: none; }

/* Área de proyección (2 columnas para ver todos) */
#areaProyeccion {
  flex: 1;
  padding: 16px 24px;
  overflow-y: auto;
  display: grid;
  grid-template-columns: 1fr 1fr; /* 2 columnas para aprovechar TV */
  gap: 8px 32px;
  align-content: start;
}

.fila-estudiante {
  display: grid;
  grid-template-columns: 160px 1fr 110px;
  align-items: center;
  gap: 12px;
  padding: 8px 12px;
  background: var(--panel);
  border-radius: 8px;
  border: 1px solid var(--border);
}

.nombre-estudiante { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Camino visual robusto */
.camino-container {
  position: relative;
  height: 36px;
  display: flex;
  align-items: center;
}
.camino-linea {
  position: absolute;
  left: 15px;
  right: 15px;
  height: 2px;
  background: var(--path);
}
.camino-marcas {
  position: absolute;
  left: 15px;
  right: 15px;
  height: 100%;
  display: flex;
  justify-content: space-between;
}
.marca {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--path);
  margin-top: 15px;
  transition: background 0.3s;
}
.marca.activo { background: var(--path-active); box-shadow: 0 0 6px var(--path-active); }

.icono-extremo { position: absolute; top: 50%; transform: translateY(-50%); font-size: 22px; z-index: 2; }
.icono-alerta { left: -5px; }
.icono-meta { right: -5px; }

.personaje {
  position: absolute;
  top: 50%;
  transform: translate(-50%, -50%);
  font-size: 28px;
  z-index: 10;
  /* Fórmula robusta: 5% a 95% del ancho */
  transition: left 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
}
.estrella {
  position: absolute;
  top: -18px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 18px;
  animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  filter: drop-shadow(0 0 6px rgba(250, 204, 21, 0.8));
}
@keyframes pop { 0% { transform: translateX(-50%) scale(0); } 100% { transform: translateX(-50%) scale(1); } }

/* Controles en la misma fila */
.controles { display: flex; gap: 6px; justify-content: flex-end; }
.btn-accion {
  width: 32px; height: 32px; border: none; border-radius: 6px;
  font-size: 16px; font-weight: 700; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.1s;
}
.btn-accion:active { transform: scale(0.9); }
.btn-mas { background: var(--success); color: white; }
.btn-menos { background: var(--danger); color: white; }
.btn-deshacer { background: var(--warning); color: #000; font-size: 14px; width: 32px; }
.btn-accion:disabled { opacity: 0.3; cursor: not-allowed; }

/* Toast */
#toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
  background: var(--panel); color: var(--txt); padding: 12px 24px; border-radius: 8px;
  border: 1px solid var(--border); font-size: 15px; font-weight: 600;
  opacity: 0; transition: all 0.3s; z-index: 1000; pointer-events: none;
}
#toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
#toast.ok { border-color: var(--success); color: var(--success); }
#toast.error { border-color: var(--danger); color: var(--danger); }

@media (max-width: 900px) {
  #areaProyeccion { grid-template-columns: 1fr; }
  .fila-estudiante { grid-template-columns: 120px 1fr 100px; }
}
</style>
</head>
<body>

<div id="pantallaInicio">
  <h1>🧭 Competencia Visual</h1>
  <div class="form-group">
    <label>Docente</label>
    <select id="selDocente"><option value="">Selecciona docente...</option></select>
  </div>
  <div class="form-group">
    <label>Curso</label>
    <select id="selCurso"><option value="">Selecciona curso...</option></select>
  </div>
  <div class="form-group">
    <label>Nombre de la sesión</label>
    <input type="text" id="nombreSesion" placeholder="Ej: Trabajo grupal 15-abril">
  </div>
  <button class="btn-primary" id="btnIniciar">Iniciar sesión</button>
</div>

<div id="pantallaPrincipal">
  <div class="header-bar">
    <div>
      <h2 id="tituloSesion">Sesión</h2>
      <div class="info" id="infoSesion"></div>
    </div>
    <div>
      <button class="btn-small" id="btnModoOscuro">🌙 Modo</button>
      <button class="btn-small btn-danger" id="btnCerrarSesion">💾 Cerrar y Guardar</button>
    </div>
  </div>

  <div id="areaProyeccion"></div>
</div>

<div id="toast"></div>

<script>
// ✅ URL YA INTEGRADA
const WEBHOOK = "https://script.google.com/macros/s/AKfycbwx6k9mYkO2H2sQDIgoRKFNhUhc9_ny8YjoJv1X6cmX6sovrhMkQtZpRrbC6BtJUoHl2A/exec";
const CURSOS = ["3°A","3°B","3°C","4°A","4°B","4°C","5°A","5°B","5°C","6°A","6°B","6°C","7°A","7°B","7°C","8°A","8°B","8°C","I°A","I°B","I°C","II°A","II°B","II°C","III°A","III°B","III°C","IV°A","IV°B","IV°C"];

const POSICION_INICIAL = 4;
const POSICION_MAX = 8;
const POSICION_MIN = 0;

let estudiantes = [];
let estado = {}; 
let docenteActual = '', cursoActual = '', nombreSesionActual = '';

const selDocente = document.getElementById('selDocente');
const selCurso = document.getElementById('selCurso');
const nombreSesionInput = document.getElementById('nombreSesion');
const btnIniciar = document.getElementById('btnIniciar');
const pantallaInicio = document.getElementById('pantallaInicio');
const pantallaPrincipal = document.getElementById('pantallaPrincipal');
const areaProyeccion = document.getElementById('areaProyeccion');
const toast = document.getElementById('toast');

function showToast(msg, tipo = '') {
  toast.textContent = msg;
  toast.className = 'show ' + tipo;
  setTimeout(() => toast.className = '', 2500);
}

async function cargarDocentes() {
  try {
    const r = await fetch(WEBHOOK + "?action=getDocentes&t=" + Date.now());
    const d = await r.json();
    if (d.success && d.docentes?.length) {
      d.docentes.forEach(n => {
        const o = document.createElement("option");
        o.value = n; o.textContent = n;
        selDocente.appendChild(o);
      });
    }
  } catch(e) { console.warn(e); }
}
cargarDocentes();

CURSOS.forEach(c => {
  const o = document.createElement("option");
  o.value = c; o.textContent = c;
  selCurso.appendChild(o);
});

btnIniciar.addEventListener('click', async () => {
  const docente = selDocente.value;
  const curso = selCurso.value;
  const nombre = nombreSesionInput.value.trim();
  
  if (!docente || !curso || !nombre) {
    showToast('Completa todos los campos', 'error');
    return;
  }
  
  docenteActual = docente;
  cursoActual = curso;
  nombreSesionActual = nombre;
  
  try {
    const url = WEBHOOK + "?action=getEstudiantes&curso=" + encodeURIComponent(curso) + "&t=" + Date.now();
    const r = await fetch(url, { cache: "no-store" });
    const d = await r.json();
    
    if (!d.success || !d.estudiantes?.length) {
      showToast('No hay estudiantes en este curso', 'error');
      return;
    }
    
    estudiantes = d.estudiantes.map(e => ({ id: e.id, nombre: String(e.nombre).trim() }));
    estado = {};
    estudiantes.forEach(est => {
      estado[est.id] = { posicion: POSICION_INICIAL, facilita: 0, interfiere: 0, historial: [] };
    });
    
    pantallaInicio.style.display = 'none';
    pantallaPrincipal.classList.add('active');
    document.getElementById('tituloSesion').textContent = nombre;
    document.getElementById('infoSesion').textContent = `${docente} • ${curso} • ${estudiantes.length} estudiantes`;
    
    renderProyeccion();
    showToast('Sesión iniciada. Todos parten en el centro.', 'ok');
  } catch(e) {
    showToast('Error al cargar estudiantes', 'error');
  }
});

function renderProyeccion() {
  areaProyeccion.innerHTML = estudiantes.map(est => {
    const estEstado = estado[est.id];
    const posicion = estEstado.posicion;
    const alcanzoMeta = posicion === POSICION_MAX;
    
    // Fórmula robusta: 5% para el extremo izquierdo, 95% para el derecho
    const leftPercent = 5 + (posicion / POSICION_MAX) * 90;
    
    return `
      <div class="fila-estudiante">
        <div class="nombre-estudiante">${est.id}. ${est.nombre}</div>
        <div class="camino-container">
          <div class="camino-linea"></div>
          <div class="camino-marcas">
            ${Array.from({length: POSICION_MAX + 1}, (_, i) => 
              `<div class="marca ${i <= posicion ? 'activo' : ''}"></div>`
            ).join('')}
          </div>
          <div class="icono-extremo icono-alerta">️</div>
          <div class="icono-extremo icono-meta">️</div>
          <div class="personaje" style="left: ${leftPercent}%">
            🧍
            ${alcanzoMeta ? '<span class="estrella">⭐</span>' : ''}
          </div>
        </div>
        <div class="controles">
          <button class="btn-accion btn-deshacer" onclick="deshacer(${est.id})" ${estEstado.historial.length === 0 ? 'disabled' : ''} title="Deshacer">↩</button>
          <button class="btn-accion btn-menos" onclick="moverEstudiante(${est.id}, -1)" title="Interfiere">−</button>
          <button class="btn-accion btn-mas" onclick="moverEstudiante(${est.id}, 1)" title="Facilita">+</button>
        </div>
      </div>
    `;
  }).join('');
}

function moverEstudiante(id, delta) {
  const estEstado = estado[id];
  const nuevaPosicion = estEstado.posicion + delta;
  
  if (nuevaPosicion < POSICION_MIN || nuevaPosicion > POSICION_MAX) {
    showToast(nuevaPosicion > POSICION_MAX ? '¡Ya alcanzó la meta!' : 'Límite mínimo alcanzado', 'error');
    return;
  }
  
  estEstado.historial.push({ posicionAnterior: estEstado.posicion, accion: delta > 0 ? 'facilita' : 'interfiere' });
  estEstado.posicion = nuevaPosicion;
  if (delta > 0) estEstado.facilita++;
  else estEstado.interfiere++;
  
  renderProyeccion();
}

function deshacer(id) {
  const estEstado = estado[id];
  if (estEstado.historial.length === 0) return;
  
  const ultimo = estEstado.historial.pop();
  estEstado.posicion = ultimo.posicionAnterior;
  if (ultimo.accion === 'facilita') estEstado.facilita--;
  else estEstado.interfiere--;
  
  renderProyeccion();
  showToast('Último movimiento deshecho', 'ok');
}

document.getElementById('btnCerrarSesion').addEventListener('click', async () => {
  if (!confirm('¿Cerrar sesión y enviar los datos al Sheet?')) return;
  
  const datos = {
    docente: docenteActual,
    curso: cursoActual,
    nombreSesion: nombreSesionActual,
    estudiantes: estudiantes.map(est => ({
      id: est.id, nombre: est.nombre, posicion: estado[est.id].posicion,
      facilita: estado[est.id].facilita, interfiere: estado[est.id].interfiere,
      alcanzoMeta: estado[est.id].posicion === POSICION_MAX
    }))
  };
  
  try {
    const res = await fetch(WEBHOOK, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({ data: JSON.stringify(datos) })
    });
    
    if (res.ok) {
      showToast('✅ Sesión guardada correctamente', 'ok');
      setTimeout(() => location.reload(), 1500);
    } else {
      showToast('Error al guardar en el Sheet', 'error');
    }
  } catch(e) {
    showToast('Error de conexión', 'error');
  }
});

document.getElementById('btnModoOscuro').addEventListener('click', () => {
  document.body.classList.toggle('light-mode');
  const esClaro = document.body.classList.contains('light-mode');
  document.getElementById('btnModoOscuro').textContent = esClaro ? '☀️ Claro' : '🌙 Oscuro';
  localStorage.setItem('modoOscuro', !esClaro);
});

if (localStorage.getItem('modoOscuro') === 'false') {
  document.body.classList.add('light-mode');
  document.getElementById('btnModoOscuro').textContent = '☀️ Claro';
}
</script>
</body>
</html>
